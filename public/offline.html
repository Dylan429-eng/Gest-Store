<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hors ligne · Atelier</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #171B26;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .wrap { max-width: 320px; }
    .logo {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .logo span { color: #C9992B; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: rgba(255,255,255,0.6); margin: 0 0 24px; line-height: 1.5; }
    button {
      background: #FFFFFF;
      color: #171B26;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="logo">Atelier<span>.</span></p>
    <h1>Pas de connexion</h1>
    <p>Impossible de charger la page. Vérifie ta connexion internet, tes ventes et dépenses ne se synchronisent qu'en ligne.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
